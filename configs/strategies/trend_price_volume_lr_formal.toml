name = "trend_price_volume_lr"
version = "v1"
enabled = true
enabled_setups = ["liquidity_reversal"]

[profile_status]
A = "diagnostic_only"
B = "diagnostic_only"
C = "proposal_enabled"

[volume]
baseline_mode = "tod_dow_log_ewma"
log_transform = true
half_life_days = 90
half_life_candidates = [60, 90, 120, 150]
bucket_keys = ["asset", "timeframe", "day_of_week", "utc_hour"]
min_bucket_samples = 30
fallback_mode = "rolling_ewma"
epsilon = 1e-12

[parameters.liquidity_reversal.assets.BTC]
sweep_max_atr_multiple = 0.8
sweep_wick_ratio_min = 0.35
sweep_rvol_min = 1.8
countertrend_sweep_rvol_min = 2.5
reclaim_max_bars = 3
reclaim_rvol_max = 1.2
require_choch_for_countertrend = true

[parameters.liquidity_reversal.assets.ETH]
sweep_max_atr_multiple = 0.8
sweep_wick_ratio_min = 0.40
sweep_rvol_min = 2.0
countertrend_sweep_rvol_min = 2.8
reclaim_max_bars = 3
reclaim_rvol_max = 1.2
require_choch_for_eth_reversal = true
require_choch_for_countertrend = true

[parameter_grid.liquidity_reversal]
sweep_max_atr_multiple = [0.5, 0.8, 1.0, 1.5]
sweep_wick_ratio_min = [0.25, 0.35, 0.40]
sweep_rvol_min = [1.5, 1.8, 2.0, 2.2]
countertrend_sweep_rvol_min = [2.0, 2.5, 2.8, 3.0]
reclaim_max_bars = [2, 3, 5]
reclaim_rvol_max = [1.0, 1.2, 1.4]
